version: "3.8"
services:
  next_app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: next_app
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres_db:5432/urlshortener?schema=public
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=urlshortener
    ports:
      - 5431:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    external: false
